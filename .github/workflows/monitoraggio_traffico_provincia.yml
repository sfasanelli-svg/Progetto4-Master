name: Monitoraggio traffico provincia di Milano (vector tiles)

# Il TRIGGER esterno (cron-job.org) chiama "ogni 5 minuti", ma ristretto a
# 7-22 ora italiana (stessa finestra di Progetto3): e' gia' la granularita'
# piu' fine richiesta nelle fasce di punta. E' lo SCRIPT
# (02_monitoraggio_traffico_tile.py, funzione intervallo_corrente) a
# decidere, in base all'ora locale italiana corrente, se la cadenza
# applicabile ADESSO e' 5 minuti (fasce di punta, 7-10 e 17-20 ora locale:
# il pattern da catturare e' concentrato li') o 30 minuti (resto della
# finestra 7-22) - scartando i tentativi che cadono nello stesso bucket
# temporale di un'esecuzione gia' fatta. Le notti (22-7) sono escluse
# deliberatamente, non solo per risparmiare quota: la metrica usata
# ovunque nel progetto e' la congestione MASSIMA per segmento, e di notte
# la circolazione e' scorrevole quasi ovunque, quindi quelle letture non
# risultano quasi mai il massimo - il taglio non peggiora la qualita' del
# dato.
#
# NESSUNO schedule nativo di GitHub in aggiunta (rimosso il 03/08, durante
# la campagna reale): con cron-job.org gia' attivo ogni 5 minuti, un
# secondo trigger indipendente sulla stessa cadenza produceva esecuzioni
# quasi in parallelo che si contendevano il push sullo stesso file
# (osservato: ~1 esecuzione su 2 falliva allo step di commit/push durante
# la finestra di punta 17-20 del primo giorno di raccolta). cron-job.org
# da solo e' sufficiente ed e' gia' verificato affidabile.
#
# CAMPAGNA A TEMPO, non raccolta continua - ma SI FERMA DA SOLA: lo script
# ha una finestra esplicita (CAMPAGNA_INIZIO/CAMPAGNA_FINE, lunedi' 03/08
# 00:00 -> mercoledi' 05/08 00:00 ora italiana, 48h) e fuori da quella
# finestra esce senza fare alcuna chiamata. Il trigger su cron-job.org puo'
# quindi restare attivo fin da subito (nessun costo prima di lunedi') e non
# serve disattivarlo alla fine (nessun costo dopo mercoledi'), a differenza
# di Progetto3. Con 803 tile, finestra 7-22 e cadenza adattiva (5 min
# punta / 30 min fuori punta), proiezione totale campagna ~193.500 chiamate
# (96,8% della quota mensile TomTom di 200.000, su una chiave dedicata a
# questo solo progetto, non condivisa con Progetto3-Master-VectorTiles).
# Il fuori-punta era stato alzato a 15 minuti la sera del 02/08 (piu'
# letture = piu' robustezza) ma RIPORTATO a 30 il pomeriggio del 03/08:
# un run troppo lento (10 minuti contro i 5 di intervallo, corretto in
# SCRIPT/02_monitoraggio_traffico_tile.py punti 5-6 del docstring) ha
# causato molte esecuzioni fallite durante la prima punta serale, e le
# esecuzioni fallite consumano comunque la quota TomTom (fallisce solo il
# commit successivo): a 15 minuti la proiezione avrebbe superato il 100%
# della quota verso la fine della campagna. Cadenza fissa a 5 minuti su
# tutte le 48h costerebbe molto di piu': non sostenibile, da qui la
# cadenza adattiva.
on:
  workflow_dispatch: {}

concurrency:
  group: monitoraggio-traffico-provincia-milano
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitoraggio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install pandas requests geopandas shapely mapbox-vector-tile pyarrow

      - name: Esegui monitoraggio traffico (803 tile)
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python SCRIPT/02_monitoraggio_traffico_tile.py

      - name: Commit e push del parquet del giorno
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # fuori dalla finestra di campagna lo script non scrive alcun
          # parquet (corretto): un glob senza corrispondenze fa fallire
          # "git add" con pathspec error, va assorbito con "|| true" invece
          # di lasciar fallire lo step (visto succedere nel test manuale
          # del 02/08, prima dell'inizio campagna)
          git add SCRIPT/traffico_provincia_*.parquet || true
          if git diff --staged --quiet; then
            echo "Nessuna nuova riga da salvare"
            exit 0
          fi
          git commit -m "Aggiorna traffico provincia $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # retry su push: anche con un solo trigger attivo, un run del
          # workflow POI (una tantum) o un run precedente ancora in coda
          # possono pushare nel frattempo - "git pull --rebase" seguito da
          # "git push" puo' fallire per una race persa, non e' un errore
          # permanente, si ritenta invece di far fallire tutto il job
          for tentativo in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "Push riuscito al tentativo $tentativo"
              exit 0
            fi
            echo "Tentativo $tentativo fallito, riprovo tra $((tentativo * 5))s..."
            sleep $((tentativo * 5))
          done
          echo "Push fallito dopo 5 tentativi"
          exit 1
